# Builds and tests every push and pull request, checks the committed question data matches the
# generator scripts, and deploys main to Railway once the build passes.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Same order as the README. Fails if someone edited the generated JSON by hand or forgot to commit it.
    - name: Check question data is up to date
      run: |
        python3 -I scripts/gen_banks.py scripts/banks
        python3 -I scripts/gen_groups.py scripts/banks
        python3 -I scripts/build_questions.py scripts/legacy/java_questions.sql src/main/resources/static/data
        python3 -I scripts/build_exams.py scripts/banks scripts/english_bank src/main/resources/static/data src/main/resources/answer-keys.json
        python3 -I scripts/build_tech.py scripts/tech_bank src/main/resources/static/data
        python3 -I scripts/build_topics.py src/main/resources/static/data src/main/resources/answer-keys.json scripts/ga_bank
        python3 -I scripts/build_backgrounds.py src/main/resources/static
        git add -A --intent-to-add
        git diff --stat --exit-code || { echo "::error::Generated data differs from the scripts. Run the build scripts and commit the output."; exit 1; }

    # The wrapper downloads Maven itself from Maven Central, which isn't covered by setup-java's cache (that's
    # ~/.m2/repository). Cache the download and retry it, so a network blip on the runner doesn't fail the build.
    - name: Cache the Maven distribution
      uses: actions/cache@v4
      with:
        path: ~/.m2/wrapper
        key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
    - name: Download Maven
      run: |
        for attempt in 1 2 3; do
          ./mvnw -B -q --version && exit 0
          echo "Maven download failed (attempt $attempt), retrying in 20 seconds"
          sleep 20
        done
        exit 1

    - name: Build and test
      run: ./mvnw -B package

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production

    steps:
    - uses: actions/checkout@v4
    - name: Install Railway CLI
      run: npm install -g @railway/cli
    # - name: Deploy to Railway
    #   env:
    #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    #   run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"
