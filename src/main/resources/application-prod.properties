spring.application.name=quizverse

# Railway injects PORT
server.port=${PORT:8080}

# PostgreSQL. Railway's Postgres plugin provides these PG* variables to the service.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Railway terminates HTTPS in front of the app, so the session cookie can be Secure.
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
