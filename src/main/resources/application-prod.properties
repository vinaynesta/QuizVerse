spring.application.name=quizverse

# Railway injects PORT
server.port=${PORT:8080}

# PostgreSQL: Railway's Postgres plugin or an external host (Neon, Supabase, ...) via these PG* variables.
# Hosted databases need SSL, so it's required by default; set PGSSLMODE=disable only for a server without SSL.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=${PGSSLMODE:require}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Railway terminates HTTPS in front of the app, so the session cookie can be Secure.
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
