<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizVerse - Profile</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#312e81"/>
</head>
<body>
    <nav id="account-bar" class="account-bar"></nav>
    <h1>Your profile</h1>
    <div class="profile-stack">
        <form id="profile-form" class="auth-card" novalidate>
            <h2>Details</h2>
            <p class="form-error" role="alert" hidden></p>
            <p class="form-success" role="status" hidden></p>
            <label>Username
                <input id="profile-username" disabled/>
                <small>Usernames can't be changed.</small>
            </label>
            <label>Name
                <input name="displayName" autocomplete="name" maxlength="60" required/>
            </label>
            <label>Email
                <input name="email" type="email" autocomplete="email" maxlength="254" required/>
            </label>
            <button type="submit" class="start-quiz-button">Save changes</button>
        </form>

        <section id="google-card" class="auth-card" hidden>
            <h2>Google sign-in</h2>
            <p id="google-text" class="card-sub"></p>
            <p class="form-error" role="alert" hidden></p>
            <p class="form-success" role="status" hidden></p>
            <div id="google-connect" hidden><div class="google-button-slot"></div></div>
            <button type="button" id="google-disconnect" class="btn-secondary" hidden>Disconnect Google</button>
        </section>

        <form id="password-form" class="auth-card" novalidate>
            <h2 id="password-title">Change password</h2>
            <p id="password-sub" class="card-sub" hidden>Your account uses Google sign-in. Set a password to also log in with your username or email.</p>
            <p class="form-error" role="alert" hidden></p>
            <p class="form-success" role="status" hidden></p>
            <label id="current-password-field">Current password
                <input name="currentPassword" type="password" autocomplete="current-password" required/>
            </label>
            <label>New password
                <input name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required/>
                <small>At least 8 characters. You'll be logged out on your other devices.</small>
            </label>
            <button type="submit" id="password-button" class="start-quiz-button">Change password</button>
        </form>

        <form id="delete-form" class="auth-card danger-card" novalidate>
            <h2>Delete account</h2>
            <p class="card-sub">This permanently deletes your account, quiz history, bookmarks and reports. It can't be undone.</p>
            <p class="form-error" role="alert" hidden></p>
            <label id="delete-password-field">Password
                <input name="password" type="password" autocomplete="current-password" required/>
            </label>
            <label id="delete-username-field" hidden>Type your username to confirm
                <input name="confirmUsername" autocomplete="off"/>
            </label>
            <button type="submit" class="btn danger-button">Delete my account</button>
        </form>
    </div>
    <script type="module" src="js/account.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
