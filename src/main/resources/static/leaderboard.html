<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizVerse - Leaderboard</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#312e81"/>
</head>
<body>
    <nav id="account-bar" class="account-bar"></nav>
    <h1 id="board-title">Leaderboard</h1>
    <div class="quiz-container">
        <section class="history-card chart-card">
            <div class="card-head">
                <h2 id="board-heading">This week</h2>
                <a id="board-switch" class="daily-link" href="leaderboard.html" hidden>Weekly leaderboard</a>
            </div>
            <p id="board-intro" class="card-sub">Loading…</p>
            <div class="table-wrap" id="board-wrap" hidden>
                <table class="topic-table">
                    <thead><tr><th>#</th><th>Name</th><th class="num">Score</th><th class="num" id="board-extra">Time</th></tr></thead>
                    <tbody id="board-rows"></tbody>
                </table>
            </div>
            <p id="board-you" class="card-sub" hidden></p>
            <p class="card-sub challenge-fine">Only exam quizzes and full mocks scored on the server and finished within the time limit are ranked. Ties go to the faster time. Hide your name on your <a href="profile.html">profile</a>.</p>
        </section>
    </div>
    <script type="module" src="js/account.js"></script>
    <script type="module" src="js/leaderboard.js"></script>
</body>
</html>
