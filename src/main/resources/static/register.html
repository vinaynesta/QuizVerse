<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizVerse - Sign up</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#312e81"/>
</head>
<body>
    <nav id="account-bar" class="account-bar"></nav>
    <h1>Create your account</h1>
    <form id="register-form" class="auth-card" novalidate>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <div id="google-signin" class="google-signin" hidden>
            <div class="google-button-slot"></div>
            <p class="auth-divider"><span>or</span></p>
        </div>
        <label>Name
            <input name="displayName" autocomplete="name" maxlength="60" required autofocus/>
        </label>
        <label>Username
            <input name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,30}" maxlength="30" required/>
            <small>3-30 letters, digits or underscores</small>
        </label>
        <label>Email
            <input name="email" type="email" autocomplete="email" maxlength="254" required/>
        </label>
        <label>Password
            <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required/>
            <small>At least 8 characters</small>
        </label>
        <button type="submit" class="start-quiz-button">Sign up</button>
        <p class="auth-switch">Already have an account? <a id="switch-link" href="login.html">Log in</a></p>
    </form>
    <script type="module" src="js/account.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
