<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizVerse - Challenge</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#312e81"/>
</head>
<body>
    <nav id="account-bar" class="account-bar"></nav>
    <h1 id="challenge-title">Challenge</h1>
    <div class="quiz-container">
        <section class="history-card chart-card">
            <p id="challenge-intro" class="challenge-intro">Loading…</p>
            <div id="challenge-actions" class="challenge-actions" hidden>
                <a id="challenge-take" class="start-quiz-button challenge-take" href="#">Take the challenge</a>
                <button type="button" id="challenge-copy" class="btn-secondary">Copy link</button>
            </div>
            <p id="challenge-status" class="card-sub" role="status"></p>
        </section>
        <section id="challenge-board" class="history-card chart-card" hidden>
            <div class="card-head"><h2>Scores</h2></div>
            <div class="table-wrap">
                <table class="topic-table">
                    <thead><tr><th>#</th><th>Name</th><th class="num">Score</th><th class="num">Correct</th><th class="num">Wrong</th><th class="num">Time</th></tr></thead>
                    <tbody id="challenge-rows"></tbody>
                </table>
            </div>
            <p class="card-sub challenge-fine">Scores are worked out on each player's device, so treat this as friendly competition. Only each player's first try through this link is ranked.</p>
        </section>
    </div>
    <script type="module" src="js/account.js"></script>
    <script type="module" src="js/challenge.js"></script>
</body>
</html>
