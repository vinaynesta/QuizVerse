<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizVerse - Unsubscribe</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#312e81"/>
</head>
<body>
    <nav id="account-bar" class="account-bar"></nav>
    <h1>Unsubscribe</h1>
    <section class="auth-card">
        <p class="form-error" role="alert" hidden></p>
        <p class="form-success" role="status" hidden></p>
        <p id="unsubscribe-text">Stop all QuizVerse reminder and summary emails?</p>
        <button type="button" id="unsubscribe-button" class="start-quiz-button">Unsubscribe</button>
        <p class="auth-switch">Changed your mind later? Turn emails back on from your <a href="profile.html">profile</a>.</p>
    </section>
    <script type="module" src="js/account.js"></script>
    <script type="module" src="js/unsubscribe.js"></script>
</body>
</html>
