<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizVerse - Forgot password</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#312e81"/>
</head>
<body>
<body>
    <nav id="account-bar" class="account-bar"></nav>
    <h1>Forgot password</h1>
    <form id="forgot-form" class="auth-card" novalidate>
        <p class="form-error" role="alert" hidden></p>
        <p class="form-success" role="status" hidden></p>
        <p>Enter the email address of your account and we'll send you a link to choose a new password.</p>
        <label>Email
            <input name="email" type="email" autocomplete="email" maxlength="254" required autofocus/>
        </label>
        <button type="submit" class="start-quiz-button">Send reset link</button>
        <p class="auth-switch">Remembered it? <a href="login.html">Log in</a></p>
    </form>
    <script type="module" src="js/account.js"></script>
    <script type="module" src="js/password-reset.js"></script>
</body>
</html>
