<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- The link carries the reset token: never send it to other sites in the Referer header. -->
    <meta name="referrer" content="no-referrer"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizVerse - Reset password</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#312e81"/>
</head>
<body>
<body>
    <nav id="account-bar" class="account-bar"></nav>
    <h1>Choose a new password</h1>
    <form id="reset-form" class="auth-card" novalidate>
        <p class="form-error" role="alert" hidden></p>
        <p class="form-success" role="status" hidden></p>
        <label>New password
            <input name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required autofocus/>
            <small>At least 8 characters</small>
        </label>
        <label>Repeat new password
            <input name="repeat" type="password" autocomplete="new-password" minlength="8" maxlength="72" required/>
        </label>
        <button type="submit" class="start-quiz-button">Save new password</button>
        <p class="auth-switch"><a href="forgot-password.html">Ask for a new link</a></p>
    </form>
    <script type="module" src="js/account.js"></script>
    <script type="module" src="js/password-reset.js"></script>
</body>
</html>
