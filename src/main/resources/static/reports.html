<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizVerse - Question reports</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/theme.js"></script>
    <link rel="manifest" href="manifest.webmanifest"/>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
    <meta name="theme-color" content="#312e81"/>
</head>
<body>
    <nav id="account-bar" class="account-bar"></nav>
    <h1>Question reports</h1>
    <div class="quiz-container">
        <p class="card-sub on-dark">Open reports, newest first. Fix the question in the bank under <code>scripts/</code>, rebuild the data, then mark the report resolved.</p>
        <div id="report-list" class="report-list"><p class="history-empty history-card">Loading...</p></div>
    </div>
    <script type="module" src="js/account.js"></script>
    <script type="module" src="js/reports.js"></script>
