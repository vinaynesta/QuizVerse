# Application name
spring.application.name=quizverse

# Server port (Railway injects PORT)
server.port=${PORT:8080}

# Local development: H2 database in a file under ./data, so accounts survive restarts.
# Production (application-prod.properties) uses PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/quizverse;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# Flyway creates the tables from src/main/resources/db/migration; Hibernate only checks them.
# Change the schema by adding a new V<n>__name.sql file, never by editing an applied one.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session cookie for login
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=30d

# Usernames (comma-separated) that can review question reports at /reports.html
quizverse.admin-usernames=${QUIZVERSE_ADMIN_USERNAMES:}

# Google sign-in: the OAuth web client id from Google Cloud Console. Blank turns the button off.
quizverse.google-client-id=${GOOGLE_CLIENT_ID:}
