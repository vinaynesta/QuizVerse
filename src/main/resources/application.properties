# Application name
spring.application.name=quizverse

# Local secrets: values in ./.env (gitignored, see .env.example) fill the ${...} placeholders below.
# Optional, so production (Railway service variables) and CI run without it.
spring.config.import=optional:file:.env[.properties]

# Server port (Railway injects PORT)
server.port=${PORT:8080}

# Local development: H2 database in a file under ./data, so accounts survive restarts.
# Production (application-prod.properties) uses PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/quizverse;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# Flyway creates the tables from src/main/resources/db/migration; Hibernate only checks them.
# Change the schema by adding a new V<n>__name.sql file, never by editing an applied one.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session cookie for login
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=30d

# Usernames (comma-separated) that can review question reports at /reports.html
quizverse.admin-usernames=${QUIZVERSE_ADMIN_USERNAMES:}

# Google sign-in: the OAuth web client id from Google Cloud Console. Blank turns the button off.
quizverse.google-client-id=${GOOGLE_CLIENT_ID:}

# Email (forgot password, reminders) through Resend. Blank turns email off; in local test mode the
# message is written to the log instead. MAIL_FROM must use a domain verified in Resend,
# e.g. "QuizVerse <no-reply@quizverse.example>".
quizverse.mail.resend-api-key=${RESEND_API_KEY:}
quizverse.mail.from=${MAIL_FROM:}
# The site's public address for links in emails, e.g. https://quizverse.up.railway.app (no trailing slash).
# Required in production: links are never built from the request's Host header there.
quizverse.public-url=${QUIZVERSE_PUBLIC_URL:}

# Signs quiz start tokens and receipts (server-side scoring, leaderboards). Any long random string; keep it
# secret. Unset: a random key per start, so quizzes running across a redeploy just aren't ranked.
quizverse.signing-key=${QUIZVERSE_SIGNING_KEY:}
